<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <title>DATA TEAM HIGHLIGHT</title>
    <style>
        /* ================= LỚP NỀN MỜ & BẢNG FORM ĐĂNG NHẬP ================= */
        
        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.65);
            display: none;
            /* Mặc định ẩn */
            justify-content: center;
            align-items: center;
            z-index: 999;
            backdrop-filter: blur(4px);
        }
        /* Hiển thị khi được thêm class .active */
        
        .modal-overlay.active {
            display: flex;
        }
        
        .login-box {
            position: relative;
            width: 90%;
            max-width: 400px;
            background: #ffffff;
            padding: 36px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: popup 0.25s ease;
        }
        
        @keyframes popup {
            from {
                transform: scale(0.85);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        /* Nút đóng (X) */
        
        .close-btn {
            position: absolute;
            top: 14px;
            right: 18px;
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
            color: #888;
            font-weight: bold;
        }
        
        .close-btn:hover {
            color: #000;
        }
        
        .login-box h3 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 24px;
            color: #222;
            font-weight: 800;
        }
        
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #444;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .input-group input:focus {
            border-color: #e60000;
        }
        /* Nút xác nhận đăng nhập bên trong bảng */
        
        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #e60000;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        
        .submit-btn:hover {
            background-color: #c40000;
        }
    </style>
</head>

<body>
    <div class="banner">
        <h2 class="sub-title">DATA TEAM HIGHLIGHT</h2>
        <h1 class="main-title">EMES ESCAPE ROOM</h1>
        <button class="btn-login" id="openLogin"><b>ĐĂNG NHẬP</b></button>
    </div>

    <!-- Bảng Popup Form Đăng Nhập -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="login-box">
            <buttion class="close-btn" id="closeLogin">&times;</buttion>
            <h3>LOGIN</h3>

            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="username">Tên đăng nhập</label>
                    <input type="text" id="username" placeholder="Nhập tài khoản ..." required autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" placeholder="Nhập mật khẩu ..." required>
                </div>

                <button type="submit" class="submit-btn">Xác nhận</button>
            </form>
        </div>
    </div>
    <!-- Script xử lý Bật / Tắt popup -->
    <script>
        const openBtn = document.getElementById('openLogin');
        const closeBtn = document.getElementById('closeLogin');
        const modal = document.getElementById('modalOverlay');

        // Bấm nút ngoài banner để hiện bảng login
        openBtn.addEventListener('click', () => {
            modal.classList.add('active');
        });

        // Bấm nút (X) để đóng bảng
        closeBtn.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        // Bấm ra vùng đen bên ngoài cũng sẽ tự đóng
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('active');
            }
        });

        // Hàm xử lý khi bấm Xác nhận đăng nhập
        function handleLogin(event) {
            event.preventDefault();

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // Ví dụ: tài khoản là "admin", mật khẩu là "123456" 
            //TRUNG QUÂN
            if (user === "trungquan" && pass === "123456") {
                alert("Đăng nhập thành công!");
                window.location.href = "./trungquan.html"; // Chuyển sang trang mới
            } else {
                alert("Sai tên đăng nhập hoặc mật khẩu!");
            }
        }
    </script>
</body>

</html>
